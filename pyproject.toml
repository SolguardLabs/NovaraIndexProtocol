[project]
name = "novara-index-protocol"
version = "0.1.0"
description = "Vyper index token protocol with Python integration tests."
requires-python = ">=3.11"
dependencies = [
  "titanoboa==0.2.8",
  "vyper==0.4.3",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
